name: PR 33 review fixes

on:
  push:
    branches: [security/rewrite-20260810]
    paths:
      - audit/pr33-review-fixes.py

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Apply review fixes
        run: python3 audit/pr33-review-fixes.py

      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test --locked --package lvau-core recovery::tests
          cargo test --locked --package lvau-stub
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features

      - name: Commit validated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git add crates/lvau-core/src/recovery.rs crates/lvau-cli/src/main.rs crates/lvau-stub/src/main.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No review fixes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): preserve recovery compatibility and SFX memory bounds"
          git push origin HEAD:security/rewrite-20260810
