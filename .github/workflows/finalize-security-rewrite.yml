name: Finalize security rewrite

on:
  push:
    branches: [security/rewrite-20260810]
    paths:
      - audit/final-hardening.py
      - audit/contributory-helper.py
      - .github/workflows/finalize-security-rewrite.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Apply hybrid recipient hardening
        run: python3 audit/final-hardening.py hybrid

      - name: Centralize contributory X25519 derivation
        run: python3 audit/contributory-helper.py

      - name: Consolidate and harden bundle extraction
        run: python3 audit/final-hardening.py bundle

      - name: Complete bundle hardening imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/lvau-core/src/bundle_stream.rs")
          text = path.read_text(encoding="utf-8")
          old = "use std::path::{Path, PathBuf};"
          new = "use std::path::{Component, Path, PathBuf};"
          if text.count(old) != 1:
              raise SystemExit("bundle_stream.rs: expected exactly one path import anchor")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Harden disclosure links and release provenance
        run: python3 audit/final-hardening.py docs-release

      - name: Add private crypto regression
        shell: bash
        run: |
          set -euo pipefail
          rm -f crates/lvau-core/tests/hybrid_hardening.rs
          cat >> crates/lvau-core/src/crypto/tests.rs <<'RS'

          #[test]
          fn zero_x25519_peer_is_rejected_by_hybrid_contributory_helper() {
              let secret = x25519_dalek::StaticSecret::from([42u8; 32]);
              let public = x25519_dalek::PublicKey::from([0u8; 32]);

              assert!(matches!(
                  derive_contributory_x25519(&secret, &public),
                  Err(CryptoError::Validation(
                      "Recipient X25519 public key is non-contributory"
                  ))
              ));
          }
          RS
          cargo fmt --all
          git diff --check

      - name: Validate complete rewritten source
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo build --locked --workspace --release
          cargo tree --locked --workspace --duplicates
          cargo run --locked --quiet --package lvau-cli -- self-test

      - name: Commit only after all validation succeeds
        run: |
          set -euo pipefail
          rm -f audit/final-hardening.py audit/contributory-helper.py
          rmdir audit 2>/dev/null || true
          rm -f .github/workflows/finalize-security-rewrite.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final hardening changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(security): finalize fail-closed rewrite"
          git push origin HEAD:security/rewrite-20260810
