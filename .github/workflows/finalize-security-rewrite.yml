name: Finalize security rewrite

on:
  push:
    branches: [security/rewrite-20260810]
    paths:
      - audit/final-hardening.py
      - .github/workflows/finalize-security-rewrite.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Apply fail-closed final hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/final-hardening.py

          # Keep this regression beside the rest of crypto's unit tests so it uses the same
          # private protocol types without widening lvau-core's public API just for testing.
          rm -f crates/lvau-core/tests/hybrid_hardening.rs
          cat >> crates/lvau-core/src/crypto/tests.rs <<'RS'

          #[test]
          fn encryption_rejects_non_contributory_x25519_recipient() {
              let input = unique_path("non-contributory-x25519.input");
              let output = unique_path("non-contributory-x25519.lvau");
              fs::write(&input, b"hybrid-hardening").unwrap();

              let (_private_key, mut recipient) = generate_keypair();
              recipient.x25519 = x25519_dalek::PublicKey::from([0u8; 32]);

              let error = encrypt_file_keypairs(
                  &input,
                  &output,
                  &[recipient],
                  SecurityProfile::Fast,
                  None,
                  None,
                  false,
              )
              .unwrap_err();

              assert!(matches!(
                  error,
                  CryptoError::Validation("Recipient X25519 public key is non-contributory")
              ));
              assert!(!output.exists());
              let _ = fs::remove_file(input);
          }
          RS

          cargo fmt --all
          git diff --check

      - name: Validate complete rewritten source
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo build --locked --workspace --release
          cargo tree --locked --workspace --duplicates
          cargo run --locked --quiet --package lvau-cli -- self-test

      - name: Commit only after all validation succeeds
        run: |
          set -euo pipefail
          rm -f audit/final-hardening.py
          rmdir audit 2>/dev/null || true
          rm -f .github/workflows/finalize-security-rewrite.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final hardening changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(security): finalize fail-closed rewrite"
          git push origin HEAD:security/rewrite-20260810
