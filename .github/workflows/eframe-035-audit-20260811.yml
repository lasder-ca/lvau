name: eframe 0.35 audit 20260811

on:
  push:
    branches: [audit/eframe-035-20260811]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  migrate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt
      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Try eframe/egui 0.35 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in ["crates/lvau-gui/Cargo.toml", "crates/lvau-stub/Cargo.toml"]:
              p = Path(name)
              s = p.read_text()
              s = s.replace('eframe = "0.29.1"', 'eframe = "0.35.0"')
              s = s.replace('egui = "0.29.1"', 'egui = "0.35.0"')
              p.write_text(s)

          gui = Path("crates/lvau-gui/src/main.rs")
          s = gui.read_text()
          s = s.replace(
              'fn update(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {',
              'fn ui(&mut self, ui: &mut egui::Ui, _frame: &mut eframe::Frame) {',
              1,
          )
          s = s.replace('ctx.request_repaint_after(Duration::from_millis(100));', 'ui.ctx().request_repaint_after(Duration::from_millis(100));', 1)
          s = s.replace('egui::CentralPanel::default().show(ctx, |ui| {', 'egui::CentralPanel::default().show(ui, |ui| {', 1)
          gui.write_text(s)

          stub = Path("crates/lvau-stub/src/main.rs")
          s = stub.read_text()
          s = s.replace(
              'fn update(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {',
              'fn ui(&mut self, ui: &mut egui::Ui, _frame: &mut eframe::Frame) {',
              1,
          )
          s = s.replace('egui::CentralPanel::default().show(ctx, |ui| {', 'egui::CentralPanel::default().show(ui, |ui| {', 1)
          stub.write_text(s)
          PY
          cargo fmt --all
          cargo update
          echo '=== quick-xml remaining ==='
          grep -A4 -B1 'name = "quick-xml"' Cargo.lock || true
          cargo tree -i quick-xml 2>/dev/null || true
          echo '=== compile ==='
          cargo check --workspace --all-targets --all-features
          echo '=== clippy ==='
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          echo '=== tests ==='
          cargo test --workspace --all-features
