name: Materialize security rewrite

on:
  push:
    branches: [security/rewrite-20260810]
    paths:
      - .github/workflows/materialize-security-rewrite.yml
      - audit/hardening.*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Reconstruct and apply the audited hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat audit/hardening.* | base64 --decode | xz --decompress > /tmp/lvau-hardening.patch
          git apply --check /tmp/lvau-hardening.patch
          git apply /tmp/lvau-hardening.patch
          cargo fmt --all
          git diff --check

      - name: Validate rewritten source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo build --locked --workspace --release
          cargo tree --locked --workspace --duplicates
          cargo run --locked --quiet --package lvau-cli -- self-test

      - name: Commit only after validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit
          rm -f .github/workflows/materialize-security-rewrite.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(security): materialize audited hardening"
          git push origin HEAD:security/rewrite-20260810
