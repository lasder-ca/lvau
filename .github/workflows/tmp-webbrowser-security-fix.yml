name: Temporary webbrowser security lockfile fix

on:
  push:
    branches: [security/webbrowser-1.2.2-20260815]

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor == 'lasder-ca'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Update vulnerable transitive dependency
        run: cargo update -p webbrowser --precise 1.2.2
      - name: Verify locked workspace
        run: cargo check --workspace --all-targets --locked
      - name: Audit updated lockfile
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/tmp-webbrowser-security-fix.yml
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf 'Changed paths:\n%s\n' "${changed[*]}"
          [[ " ${changed[*]} " == *" Cargo.lock "* ]]
          [[ " ${changed[*]} " == *" .github/workflows/tmp-webbrowser-security-fix.yml "* ]]
          [[ ${#changed[@]} -eq 2 ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/tmp-webbrowser-security-fix.yml
          git commit -m 'fix(security): update webbrowser to 1.2.2'
          git push origin HEAD:security/webbrowser-1.2.2-20260815
