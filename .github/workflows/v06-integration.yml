      - name: Apply v0.6.0 implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/lvau-v06-impl.patch
          git apply /tmp/lvau-v06-impl.patch
          git apply --check /tmp/lvau-v06-stream.patch
          git apply /tmp/lvau-v06-stream.patch
          git apply --check /tmp/lvau-v06-version.patch
          git apply /tmp/lvau-v06-version.patch
          git diff --check

      - name: Refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release

      - name: Dependency duplicates
        run: cargo tree --duplicates

      - name: Self test
        run: cargo run --locked --quiet --package lvau-cli -- self-test

      - name: CLI v2/v3 roundtrips
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'Lvau v0.6.0 GitHub integration test\n' > "$tmp/plain.txt"
          printf '%s' 'lvau-v06-ci-only-passphrase' > "$tmp/password.txt"
          chmod 600 "$tmp/password.txt"

          target/release/lvau-cli encrypt --in-file "$tmp/plain.txt" --out-file "$tmp/v2.lvau" --password-file "$tmp/password.txt" --profile fast
          target/release/lvau-cli verify --in-file "$tmp/v2.lvau" --password-file "$tmp/password.txt"
          target/release/lvau-cli decrypt --in-file "$tmp/v2.lvau" --out-file "$tmp/v2.out" --password-file "$tmp/password.txt"
          cmp "$tmp/plain.txt" "$tmp/v2.out"

          target/release/lvau-cli encrypt --format v3 --suite LV3-XC20P --in-file "$tmp/plain.txt" --out-file "$tmp/v3.lvau" --password-file "$tmp/password.txt" --profile fast
          target/release/lvau-cli verify --in-file "$tmp/v3.lvau" --password-file "$tmp/password.txt"
          target/release/lvau-cli decrypt --in-file "$tmp/v3.lvau" --out-file "$tmp/v3.out" --password-file "$tmp/password.txt"
          cmp "$tmp/plain.txt" "$tmp/v3.out"

          target/release/lvau-cli encrypt --format v3 --suite LV3-AESGCMSIV-XC20P --in-file "$tmp/plain.txt" --out-file "$tmp/v3-layered.lvau" --password-file "$tmp/password.txt" --profile fast
          target/release/lvau-cli verify --in-file "$tmp/v3-layered.lvau" --password-file "$tmp/password.txt"
          target/release/lvau-cli decrypt --in-file "$tmp/v3-layered.lvau" --out-file "$tmp/v3-layered.out" --password-file "$tmp/password.txt"
          cmp "$tmp/plain.txt" "$tmp/v3-layered.out"

          cp "$tmp/v3.lvau" "$tmp/tampered.lvau"
          python3 - "$tmp/tampered.lvau" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[-1] ^= 1
          path.write_bytes(data)
          PY
          if target/release/lvau-cli verify --in-file "$tmp/tampered.lvau" --password-file "$tmp/password.txt"; then
            echo "tampered v3 capsule unexpectedly verified" >&2
            exit 1
          fi

      - name: Commit validated implementation
        shell: bash
        env:
          BRANCH: feat/v0.6.0-v3-streaming
        run: |
          set -euo pipefail
          git rm .github/workflows/v06-integration.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete experimental v0.6 format v3"
          git push origin "HEAD:${BRANCH}"
