name: Apply audited CLI consistency fixes

on:
  push:
    branches: [docs/rewrite-project-copy-20260722]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rewrite-project-copy-20260722
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/lvau-cli/src/main.rs")
          source = path.read_text()

          diff_marker = "let report = lvau_core::diff::diff_bundles"
          command = 'output::print_success("report", &report)?;'
          diff_start = source.index(diff_marker)
          command_start = source.index(command, diff_start)
          source = (
              source[:command_start]
              + 'output::print_success("bundle-diff", &report)?;'
              + source[command_start + len(command):]
          )

          secret_start = source.index("Commands::Secret { action } => match action {")
          secret_end = source.index("Commands::SignKeygen", secret_start)
          secret_section = source[secret_start:secret_end]
          count = secret_section.count("SecurityProfile::Fast")
          if count != 2:
              raise SystemExit(f"expected 2 structured-secret Fast profiles, found {count}")
          secret_section = secret_section.replace(
              "SecurityProfile::Fast",
              "SecurityProfile::Balanced",
          )
          source = source[:secret_start] + secret_section + source[secret_end:]

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/lvau-cli/src/main.rs
          git commit -m "fix(cli): align JSON command and secret profile"
          git push origin HEAD:docs/rewrite-project-copy-20260722
