version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    # Surface a small number of routine updates for explicit review; never auto-merge them.
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    # Surface a small number of routine updates for explicit review; never auto-merge them.
    open-pull-requests-limit: 3
