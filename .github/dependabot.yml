version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    # Keep security updates available while pausing routine version-update PRs.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    # Keep security updates available while pausing routine version-update PRs.
    open-pull-requests-limit: 0
